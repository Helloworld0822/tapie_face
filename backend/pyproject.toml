[project]
name = "backend"
version = "0.1.0"
description = "Local TAPIE FACE API powered by the face analysis model"
readme = "README.md"
authors = [
    { name = "Helloworld0822", email = "a100822@naver.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "model",
    "pydantic-settings>=2.10.0",
    "typer>=0.16.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.uv.sources]
model = { path = "../model", editable = true }

[project.scripts]
backend = "backend.__main__:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
pythonPlatform = "All"
reportMissingTypeStubs = false
include = ["src"]

[tool.ruff]
extend = "../model/pyproject.toml"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
